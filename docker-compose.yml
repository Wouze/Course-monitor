services:
  bot:
    build: .
    restart: unless-stopped
    # Coolify often strips host mode and puts the bot on a bridge Edugate resets.
    network_mode: host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      USERS_FILE: /app/data/users.json
      SESSION_FILE: /app/data/session.json
      CHECK_INTERVAL: ${CHECK_INTERVAL:-60}
      MIN_CHECK_INTERVAL: ${MIN_CHECK_INTERVAL:-15}
      CHECK_JITTER: ${CHECK_JITTER:-5}
      EDUGATE_PROXY: ${EDUGATE_PROXY:-}
    volumes:
      - bot-data:/app/data

volumes:
  bot-data:
